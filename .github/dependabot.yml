version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    # A dependency belongs to the first group it matches, so order matters.
    groups:
      # Payload core + first-party packages share strict same-version peer deps, so any
      # individual bump breaks `npm install`. graphql is version-constrained by Payload's
      # peer deps, keep it in the same PR.
      payload:
        patterns:
          - "payload"
          - "@payloadcms/*"
          - "payload-*"
          - "graphql"
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      lint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "typescript-eslint"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss"
      playwright:
        patterns:
          - "playwright"
          - "@playwright/test"
      nodemailer:
        patterns:
          - "nodemailer"
          - "@types/nodemailer"
    ignore:
      # Payload's peer deps require graphql ^16; drop once Payload supports graphql 17.
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      # Pinned to 9.x: eslint-plugin-react (also transitive via eslint-config-next) caps eslint at ^9.7.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint caps typescript at <6.1.0; drop once it supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the runtime Node major (LTS). Bump together with the Dockerfile/CI Node image.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Pinned to the active Node LTS major; non-LTS bumps (odd majors / next LTS) require a manual coordinated bump.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # upload/download and the Pages action trio use versioned wire formats and
      # must be bumped in lockstep.
      pages:
        patterns:
          - "actions/configure-pages"
          - "actions/upload-pages-artifact"
          - "actions/deploy-pages"
      artifacts:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
      docker:
        patterns:
          - "docker/*"
